<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINITECH — Command every key you run</title>
  <meta name="description" content="Phần mềm hỗ trợ thi trực tuyến MINITECH">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="shortcut icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-panel: #0d121f;
      --border-color: rgba(59, 130, 246, 0.2);
      --accent-blue: #0088ff;
      --accent-gradient: linear-gradient(135deg, #0088ff 0%, #0055ff 100%);
      --accent-glow: rgba(0, 136, 255, 0.4);
      --text-white: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Particle Canvas */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Synchronized Ambient Grid */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 2;
    }

    /* Mouse Cursor Spotlight Glow */
    .cursor-spotlight {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 136, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }

    /* Top Navbar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 2.5rem;
      background: rgba(7, 9, 14, 0.8);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
      height: 65px;
      width: 100%;
      animation: fadeInDown 0.8s ease-out;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
    }

    .brand-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 136, 255, 0.7));
      transition: transform 0.3s ease;
    }

    .brand-logo:hover .brand-logo-img {
      transform: scale(1.08) rotate(5deg);
    }

    .brand-logo-text {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: white;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s;
    }

    .nav-link:hover {
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .btn-get-started {
      background: var(--accent-gradient);
      color: white;
      text-decoration: none;
      padding: 0.6rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 0 25px rgba(0, 136, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-get-started:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 35px rgba(0, 136, 255, 0.8);
    }

    /* Hero Main Section */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      margin: auto;
    }

    /* 3D Floating Glowing Emblem Container */
    .hero-logo-wrapper {
      position: relative;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInUp 1s ease-out 0.2s both;
    }

    /* Glowing Aura Rings behind Emblem */
    .glow-aura {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 136, 255, 0.4) 0%, rgba(0, 210, 255, 0.15) 50%, transparent 70%);
      filter: blur(20px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    .hero-logo-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(0, 136, 255, 0.9)) drop-shadow(0 0 15px rgba(56, 189, 248, 0.7));
      animation: float3D 5s ease-in-out infinite alternate;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .hero-logo-img:hover {
      transform: scale(1.15) rotateY(15deg) rotateX(10deg);
    }

    /* Title with Dynamic Gradient Shimmer */
    .hero-title {
      font-size: clamp(3.2rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 1.25rem;
      background: linear-gradient(90deg, #ffffff 0%, #38bdf8 25%, #ffffff 50%, #60a5fa 75%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 6s linear infinite, fadeInUp 1s ease-out 0.4s both;
      filter: drop-shadow(0 0 25px rgba(0, 136, 255, 0.3));
    }

    /* Subtitle */
    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--text-muted);
      font-weight: 500;
      max-width: 620px;
      margin-bottom: 3.25rem;
      line-height: 1.6;
      animation: fadeInUp 1s ease-out 0.6s both;
    }

    /* Action Buttons */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      animation: fadeInUp 1s ease-out 0.8s both;
    }

    .btn-action-primary {
      background: var(--accent-gradient);
      color: white;
      text-decoration: none;
      padding: 0.9rem 2.4rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      box-shadow: 0 0 30px rgba(0, 136, 255, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-action-primary::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(45deg);
      transition: 0.5s;
      opacity: 0;
    }

    .btn-action-primary:hover::before {
      animation: shine 1.5s ease-out infinite;
      opacity: 1;
    }

    .btn-action-primary:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 0 50px rgba(0, 136, 255, 0.85);
    }

    .btn-action-secondary {
      background: rgba(13, 18, 31, 0.8);
      border: 1px solid var(--border-color);
      color: white;
      text-decoration: none;
      padding: 0.9rem 2.2rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      backdrop-filter: blur(16px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action-secondary:hover {
      background: rgba(0, 136, 255, 0.18);
      border-color: rgba(0, 136, 255, 0.5);
      transform: translateY(-4px);
      box-shadow: 0 0 30px rgba(0, 136, 255, 0.3);
    }

    /* Keyframes Animations */
    @keyframes float3D {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    @keyframes textShimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes shine {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      padding: 2rem 1.5rem;
      text-align: center;
      color: #475569;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      header { padding: 0.85rem 1.25rem; }
      .hero-actions { flex-direction: column; width: 100%; max-width: 320px; }
      .btn-action-primary, .btn-action-secondary { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Particle Background Canvas -->
  <canvas id="bg-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="cursor-spotlight" id="spotlight"></div>

  <!-- Top Navbar -->
  <header>
    <a href="/" class="brand-logo">
      <img src="/logo.png" alt="MINITECH Logo" class="brand-logo-img">
      <span class="brand-logo-text">MINITECH</span>
    </a>

    <div class="nav-actions">
      <a href="/login.html" class="nav-link">Log in</a>
      <a href="/support.html" class="btn-get-started">
        Get started ➔
      </a>
    </div>
  </header>

  <!-- Hero Main Section -->
  <main>
    <!-- MINITECH 3D Cube Glowing Logo Container -->
    <div class="hero-logo-wrapper">
      <div class="glow-aura"></div>
      <img src="/logo.png" alt="MINITECH Logo Emblem" class="hero-logo-img">
    </div>

    <!-- Title & Subtitle -->
    <h1 class="hero-title">MINITECH</h1>
    <p class="hero-subtitle">Command every key you run — from one place.</p>

    <!-- Action Navigation Buttons -->
    <div class="hero-actions">
      <a href="/support.html" class="btn-action-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Join room
      </a>
      <a href="/login.html" class="btn-action-secondary">
        Log In ➔
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2026 MINITECH. All rights reserved.
  </footer>

  <!-- High Tech Canvas Particles & Cursor Interaction Script -->
  <script>
    // Spotlight follows cursor
    const spotlight = document.getElementById('spotlight');
    document.addEventListener('mousemove', (e) => {
      spotlight.style.left = e.clientX + 'px';
      spotlight.style.top = e.clientY + 'px';
    });

    // Particle Background System
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let mouse = { x: null, y: null, radius: 150 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.radius = Math.random() * 1.8 + 0.8;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 136, 255, ${this.alpha})`;
        ctx.fill();
      }
    }

    const count = Math.min(Math.floor((width * height) / 14000), 70);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        // Connect particles to each other
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0, 136, 255, ${0.2 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }

        // Connect particles to mouse cursor
        if (mouse.x && mouse.y) {
          const mdx = particles[i].x - mouse.x;
          const mdy = particles[i].y - mouse.y;
          const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
          if (mdist < mouse.radius) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${0.4 * (1 - mdist / mouse.radius)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>

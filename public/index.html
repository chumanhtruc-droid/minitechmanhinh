<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINITECH — Command every key you run</title>
  <meta name="description" content="Minitech — Hệ thống hỗ trợ thi và quản lý Key tập trung cao cấp.">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050811;
      --bg-card: rgba(10, 16, 30, 0.7);
      --accent-blue: #0088ff;
      --accent-cyan: #00d2ff;
      --accent-deep: #0055ff;
      --gradient-primary: linear-gradient(135deg, #0088ff 0%, #00d2ff 100%);
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --glass-border: rgba(0, 136, 255, 0.2);
      --glass-glow: rgba(0, 136, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(0, 136, 255, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 20% 20%, rgba(0, 85, 255, 0.1) 0%, transparent 50%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle cyber grid overlay */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, rgba(0, 136, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0, 136, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header Navbar */
    header {
      position: relative;
      z-index: 10;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: white;
    }

    .brand-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 136, 255, 0.6));
    }

    .brand-logo-text {
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffffff, #80c4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: white;
    }

    .btn-get-started {
      background: var(--gradient-primary);
      color: white;
      text-decoration: none;
      padding: 0.65rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 0 25px rgba(0, 136, 255, 0.5);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-get-started:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.7);
    }

    /* Hero Section */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      margin: auto;
    }

    /* Center Minitech Logo Mascot Icon */
    .hero-logo-container {
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(0, 136, 255, 0.25) 0%, rgba(5, 8, 17, 0.85) 70%);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      position: relative;
      box-shadow: 0 0 80px rgba(0, 136, 255, 0.4);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero-logo-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.9));
    }

    /* Title */
    .hero-title {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 1.25rem;
      background: linear-gradient(180deg, #ffffff 30%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(0, 136, 255, 0.3);
    }

    /* Subtitle */
    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--text-muted);
      font-weight: 400;
      max-width: 600px;
      margin-bottom: 3rem;
      letter-spacing: -0.01em;
    }

    /* Action Buttons */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .btn-action-primary {
      background: var(--gradient-primary);
      color: white;
      text-decoration: none;
      padding: 0.9rem 2.4rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 0 35px rgba(0, 136, 255, 0.55);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 50px rgba(0, 210, 255, 0.8);
    }

    .btn-action-secondary {
      background: rgba(10, 16, 30, 0.6);
      border: 1px solid var(--glass-border);
      color: white;
      text-decoration: none;
      padding: 0.9rem 2.4rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action-secondary:hover {
      background: rgba(0, 136, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.4);
      transform: translateY(-3px);
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      padding: 2rem 1.5rem;
      text-align: center;
      color: #475569;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      header {
        padding: 1.25rem 1.5rem;
      }
      .hero-actions {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }
      .btn-action-primary, .btn-action-secondary {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header>
    <a href="/" class="brand-logo">
      <img src="/logo.png" alt="MINITECH Logo" class="brand-logo-img">
      <span class="brand-logo-text">MINITECH</span>
    </a>

    <div class="nav-actions">
      <a href="/login.html" class="nav-link">Log in</a>
      <a href="/support.html" class="btn-get-started">
        Get started ➔
      </a>
    </div>
  </header>

  <!-- Hero Main Section -->
  <main>
    <!-- MINITECH 3D Cube Logo Container -->
    <div class="hero-logo-container">
      <img src="/logo.png" alt="MINITECH Logo Emblem" class="hero-logo-img">
    </div>

    <!-- Title & Subtitle -->
    <h1 class="hero-title">MINITECH</h1>
    <p class="hero-subtitle">Command every key you run — from one place.</p>

    <!-- Action Navigation Buttons -->
    <div class="hero-actions">
      <a href="/support.html" class="btn-action-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Join room
      </a>
      <a href="/login.html" class="btn-action-secondary">
        Log In ➔
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2026 MINITECH. All rights reserved.
  </footer>

</body>
</html>

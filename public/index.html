<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINITECH — Command every key you run</title>
  <meta name="description" content="Phần mềm hỗ trợ thi trực tuyến MINITECH">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="shortcut icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-panel: #0d121f;
      --border-color: rgba(59, 130, 246, 0.18);
      --accent-blue: #0088ff;
      --accent-gradient: linear-gradient(135deg, #0088ff 0%, #0055ff 100%);
      --accent-glow: rgba(0, 136, 255, 0.35);
      --text-white: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 136, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 85, 255, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.5) 0%, transparent 100%);
    }

    /* Synchronized Ambient Dot Matrix Grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* Synchronized Top Navbar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 2rem;
      background: rgba(7, 9, 14, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
      height: 60px;
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
    }

    .brand-logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0, 136, 255, 0.5));
    }

    .brand-logo-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: white;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: white;
    }

    .btn-get-started {
      background: var(--accent-gradient);
      color: white;
      text-decoration: none;
      padding: 0.55rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 0 20px rgba(0, 136, 255, 0.4);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-get-started:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 136, 255, 0.6);
    }

    /* Hero Main Section */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      margin: auto;
    }

    /* Center MINITECH Logo Mascot Icon */
    .hero-logo-container {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, rgba(0, 136, 255, 0.2) 0%, rgba(7, 9, 14, 0.9) 70%);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      position: relative;
      box-shadow: 0 0 60px rgba(0, 136, 255, 0.35);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero-logo-img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0, 136, 255, 0.8));
    }

    /* Title */
    .hero-title {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 1.25rem;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(0, 136, 255, 0.4);
    }

    /* Subtitle */
    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--text-muted);
      font-weight: 500;
      max-width: 600px;
      margin-bottom: 3rem;
    }

    /* Action Buttons */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .btn-action-primary {
      background: var(--accent-gradient);
      color: white;
      text-decoration: none;
      padding: 0.85rem 2.2rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 0 30px rgba(0, 136, 255, 0.5);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 45px rgba(0, 136, 255, 0.75);
    }

    .btn-action-secondary {
      background: rgba(13, 18, 31, 0.8);
      border: 1px solid var(--border-color);
      color: white;
      text-decoration: none;
      padding: 0.85rem 2.2rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action-secondary:hover {
      background: rgba(0, 136, 255, 0.15);
      border-color: rgba(0, 136, 255, 0.4);
      transform: translateY(-3px);
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      padding: 2rem 1.5rem;
      text-align: center;
      color: #475569;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      header {
        padding: 0.85rem 1.25rem;
      }
      .hero-actions {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }
      .btn-action-primary, .btn-action-secondary {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Synchronized Top Navbar -->
  <header>
    <a href="/" class="brand-logo">
      <img src="/logo.png" alt="MINITECH Logo" class="brand-logo-img">
      <span class="brand-logo-text">MINITECH</span>
    </a>

    <div class="nav-actions">
      <a href="/login.html" class="nav-link">Log in</a>
      <a href="/support.html" class="btn-get-started">
        Get started ➔
      </a>
    </div>
  </header>

  <!-- Hero Main Section -->
  <main>
    <!-- MINITECH 3D Cube Logo Container -->
    <div class="hero-logo-container">
      <img src="/logo.png" alt="MINITECH Logo Emblem" class="hero-logo-img">
    </div>

    <!-- Title & Subtitle -->
    <h1 class="hero-title">MINITECH</h1>
    <p class="hero-subtitle">Command every key you run — from one place.</p>

    <!-- Action Navigation Buttons -->
    <div class="hero-actions">
      <a href="/support.html" class="btn-action-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Join room
      </a>
      <a href="/login.html" class="btn-action-secondary">
        Log In ➔
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2026 MINITECH. All rights reserved.
  </footer>

</body>
</html>

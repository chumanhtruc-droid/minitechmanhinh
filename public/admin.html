<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Quản Lý Admin — MINITECH</title>
  <meta name="description" content="Quản lý Key và Phiên Thi MINITECH">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="shortcut icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-panel: #0d121f;
      --bg-card: #131b2e;
      --bg-input: #1a243b;
      --border-color: rgba(59, 130, 246, 0.18);
      --border-focus: #0088ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #0088ff;
      --accent-gradient: linear-gradient(135deg, #0088ff 0%, #0055ff 100%);
      --accent-glow: rgba(0, 136, 255, 0.35);
      --success-green: #10b981;
      --danger-red: #ef4444;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 136, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 85, 255, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.5) 0%, transparent 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 2rem;
      background: rgba(7, 9, 14, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      height: 60px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
    }

    .brand-logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0, 136, 255, 0.5));
    }

    .brand-logo-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: white;
      text-transform: uppercase;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: white;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: rgba(0, 136, 255, 0.2);
      border-color: var(--accent-blue);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    main {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-input, .form-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 136, 255, 0.4);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 136, 255, 0.6);
    }

    .generated-box {
      margin-top: 1.25rem;
      padding: 1rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed var(--success-green);
      border-radius: 8px;
      display: none;
    }

    .generated-box.show { display: block; }

    .key-code {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--success-green);
      letter-spacing: 0.05em;
      user-select: all;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      padding: 0.85rem 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 0.875rem;
    }

    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--success-green); }
    .badge-expired { background: rgba(239, 68, 68, 0.15); color: var(--danger-red); }

    .action-btn-small {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: white;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn-small:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger-red);
      color: var(--danger-red);
    }

    /* Filter Tabs Styling */
    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: rgba(0, 136, 255, 0.15);
      color: white;
      border-color: var(--accent-blue);
    }

    .filter-btn.active {
      background: var(--accent-gradient);
      color: white;
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(0, 136, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Particle Background Canvas -->
  <canvas id="bg-canvas" style="position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;"></canvas>
  <div style="position:fixed; inset:0; background-image:radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size:28px 28px; pointer-events:none; z-index:2;"></div>

  <header style="position:relative; z-index:10;">
    <a href="/" class="brand-logo">
      <img src="/logo.png" alt="MINITECH Logo" class="brand-logo-img">
      <span class="brand-logo-text">MINITECH ADMIN</span>
    </a>

    <div style="display: flex; gap: 1rem;">
      <a href="/support.html" class="nav-btn">
        💬 Phòng Trợ Giúp Thi
      </a>
      <button onclick="logout()" class="nav-btn btn-logout">
        🔒 Đăng xuất
      </button>
    </div>
  </header>

  <main>
    <!-- Left Card: Generate Key -->
    <div class="card">
      <h2 class="card-title">🔑 Tạo Key Kích Hoạt Mới</h2>
      <form id="gen-form" onsubmit="generateKey(event)">
        <div class="form-group">
          <label class="form-label">Thời hạn Key</label>
          <select id="duration" class="form-select">
            <option value="1">1 Giờ (Dùng thử)</option>
            <option value="24" selected>24 Giờ (1 Ngày)</option>
            <option value="72">72 Giờ (3 Ngày)</option>
            <option value="720">720 Giờ (30 Ngày)</option>
            <option value="2880">2880 Giờ (120 Ngày)</option>
            <option value="0">Vĩnh viễn (Không giới hạn)</option>
          </select>
        </div>

        <button type="button" onclick="generateKey(event)" class="btn-submit">⚡ Tạo Key Ngay</button>
      </form>

      <div id="gen-result" class="generated-box" style="margin-top:1.25rem; padding:1rem; background:rgba(16,185,129,0.1); border:1px dashed var(--success-green); border-radius:8px; display:none;">
        <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.4rem;">Mã Key vừa tạo:</div>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem;">
          <div id="key-output" class="key-code" style="font-family:monospace; font-size:1.1rem; font-weight:800; color:var(--success-green); user-select:all;"></div>
          <button type="button" onclick="copyGenKey()" style="background:#10b981; color:white; border:none; padding:0.35rem 0.75rem; border-radius:6px; font-weight:700; font-size:0.75rem; cursor:pointer;">📋 Copy</button>
        </div>
      </div>
    </div>

    <!-- Right Card: Active Keys Table -->
    <div class="card">
      <h2 class="card-title">📋 Danh Sách Key & Quản Lý HWID</h2>
      
      <!-- Category Filter Tabs -->
      <div class="filter-tabs" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem;">
        <button class="filter-btn active" onclick="setFilter('all', this)">📌 Tất cả Key</button>
        <button class="filter-btn" onclick="setFilter('1', this)">⚡ 1 Giờ</button>
        <button class="filter-btn" onclick="setFilter('24', this)">📅 1 Ngày</button>
        <button class="filter-btn" onclick="setFilter('72', this)">🚀 3 Ngày</button>
        <button class="filter-btn" onclick="setFilter('720', this)">💎 30 Ngày</button>
        <button class="filter-btn" onclick="setFilter('2880', this)">👑 120 Ngày</button>
        <button class="filter-btn" onclick="setFilter('0', this)">♾️ Vĩnh Viễn</button>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Mã Key</th>
              <th>Loại Gói Key</th>
              <th>Trạng thái</th>
              <th>Thời hạn còn lại</th>
              <th>HWID Đã Khóa</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="keys-tbody">
            <tr><td colspan="6" style="text-align:center; color:var(--text-muted);">Đang tải danh sách Key...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let currentFilter = 'all';
    let allKeysCache = [];

    function setFilter(filterVal, btnEl) {
      currentFilter = filterVal;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderKeysTable();
    }

    function renderKeysTable() {
      const tbody = document.getElementById('keys-tbody');
      let filtered = allKeysCache;
      if (currentFilter !== 'all') {
        const filterHours = parseInt(currentFilter, 10);
        filtered = allKeysCache.filter(k => k.durationHours === filterHours);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">Không có Key nào trong mục này.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(k => `
        <tr>
          <td style="font-family:monospace; font-weight:700; color:var(--accent-blue);">${k.key}</td>
          <td><span style="background:rgba(0,136,255,0.15); border:1px solid rgba(0,136,255,0.3); color:#38bdf8; padding:0.2rem 0.65rem; border-radius:6px; font-weight:700; font-size:0.75rem;">${k.durationText || 'Vĩnh viễn'}</span></td>
          <td><span class="badge ${k.status === 'active' ? 'badge-active' : 'badge-expired'}">${k.status}</span></td>
          <td>${k.remainingTimeText || (k.durationHours === 0 ? 'Vĩnh viễn' : 'Chưa kích hoạt')}</td>
          <td style="font-family:monospace; font-size:0.75rem; color:${k.hwid ? '#10b981' : 'var(--text-muted)'};">${k.hwid || 'Chưa gắn'}</td>
          <td>
            <button onclick="deleteKey('${k.key}')" class="action-btn-small">Xóa Key</button>
          </td>
        </tr>
      `).join('');
    }

    async function loadKeys() {
      try {
        const res = await fetch('/api/keys');
        const data = await res.json();
        if (data.success && data.keys) {
          allKeysCache = data.keys;
          renderKeysTable();
        }
      } catch (err) {
        console.error("Lỗi tải danh sách key:", err);
      }
    }

    async function generateKey(e) {
      if (e) e.preventDefault();
      const duration_hours = document.getElementById('duration').value;
      try {
        const res = await fetch('/api/generate-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ duration_hours })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('key-output').textContent = data.key;
          document.getElementById('gen-result').style.display = 'block';
          await loadKeys();
        } else {
          alert("Lỗi: " + (data.message || "Không tạo được Key"));
        }
      } catch (err) {
        console.error(err);
        alert("Lỗi máy chủ khi tạo Key!");
      }
    }

    function copyGenKey() {
      const keyCode = document.getElementById('key-output').textContent;
      if (keyCode) {
        navigator.clipboard.writeText(keyCode);
        alert(`Đã copy mã Key: ${keyCode}`);
      }
    }

    async function deleteKey(key) {
      if (!confirm(`Bạn có chắc muốn xóa Key ${key}?`)) return;
      try {
        const res = await fetch('/api/delete-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const data = await res.json();
        if (data.success) {
          loadKeys();
        } else {
          alert(data.message || "Không thể xóa Key!");
        }
      } catch (err) {
        alert("Lỗi kết nối xóa Key!");
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    loadKeys();
    setInterval(loadKeys, 5000);

    // Spotlight follows cursor
    const spotlight = document.getElementById('spotlight');
    document.addEventListener('mousemove', (e) => {
      if (spotlight) {
        spotlight.style.left = e.clientX + 'px';
        spotlight.style.top = e.clientY + 'px';
      }
    });

    // Particle Background System
    const canvas = document.getElementById('bg-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let width, height, particles = [];
      function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.7;
          this.vy = (Math.random() - 0.5) * 0.7;
          this.radius = Math.random() * 1.8 + 0.8;
          this.alpha = Math.random() * 0.5 + 0.2;
        }
        update() {
          this.x += this.vx; this.y += this.vy;
          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 136, 255, ${this.alpha})`;
          ctx.fill();
        }
      }
      const count = Math.min(Math.floor((width * height) / 15000), 50);
      for (let i = 0; i < count; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 110) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(0, 136, 255, ${0.18 * (1 - dist / 110)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>
